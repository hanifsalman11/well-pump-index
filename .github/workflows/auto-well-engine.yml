name: Autonomous Well Pump TDH & Pressure Tank Sizing Engine

on:
  schedule:
    - cron: '22 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_well:
        description: 'Optional Well Pump or Depth (e.g. Goulds 10GS07412 3/4 HP)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-well-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Well Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_WELL: ${{ github.event.inputs.custom_well || '' }}
        run: |
          python engine/well_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_wells.json
          if git diff --staged --quiet; then
            echo "No new well pump calculator pages to commit."
          else
            git commit -m "chore(well): auto-publish new well pump TDH & pressure tank calculators"
            git push origin main
          fi
